# GPU environment with FlashAttention-2 (same pins as bamivshuit/environment-fa2.yaml:
# Python 3.11, PyTorch 2.4.0 + CUDA 12.4, transformers 4.57.1, flash_attn 2.6.3).
#
#   conda env create -f environment-fa2.yml
#   conda activate legal-st-fa2
#   pip install "flash_attn==2.6.3" --no-build-isolation
#
# FlashAttention-2 needs an Ampere-or-newer GPU (RTX 4090: yes, T4: no). On T4
# skip the flash_attn install; attn_implementation: auto then uses sdpa.
# Only ModernBERT (bert-tiny/base-stage2) uses FA2; RoBERTa (BamiBERT) has no
# FA2 path in transformers 4.57.1 and falls back to sdpa.
name: legal-st-fa2
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - git
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu124
      - torch==2.4.0
      - transformers==4.57.1
      - sentence-transformers==5.1.2
      - accelerate
      - datasets>=2.19,<4
      - huggingface-hub>=0.29,<1.0
      - rank-bm25
      - tabulate
      - pyyaml
      - scikit-learn
      - scipy
      - pandas
      - pyarrow
      - ninja
      - packaging
      - -e .
